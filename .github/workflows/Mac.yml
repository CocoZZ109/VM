name: mac
on:
  push:
  workflow_dispatch:
jobs:
  vm:
    runs-on: macos-13
    steps:
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: mac-vnc
      - run: |
          sudo dscl . -passwd /Users/runner "${{ secrets.VNC_PASS }}"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${{ secrets.VNC_PASS }}"
      - run: tailscale ip -4
      - run: sleep 21000
