name: vnc
on:
  push:
  workflow_dispatch:
jobs:
  vm:
    runs-on: windows-2022
    steps:
      - run: choco install tightvnc -y --installarguments "'SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=${{ secrets.VNC_PASS }}'"
      - run: Start-Service tvnserver
      - run: pip install websockify
      - run: git clone --depth 1 https://github.com/novnc/noVNC.git
      - run: Start-Process python -ArgumentList "-m","websockify","--web","noVNC","6080","localhost:5900"
      - run: choco install cloudflared -y
      - run: cloudflared tunnel --url http://localhost:6080
